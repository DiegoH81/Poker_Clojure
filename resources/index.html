<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mesa de Póker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="mesa-juego">
    <div id="esperando-overlay" style="display:none;">
        <p class="esperando-texto">Esperando jugadores...</p>
    </div>
    <div id="fondo"></div>

    <div id="rivales"></div>

    <div id="ganador-overlay">
        <p class="ganador-texto"></p>
        <button id="btn-reinicio" onclick="enviarReinicio()">
            Siguiente Ronda
        </button>
        <p id="texto-espera-reinicio"></p>
    </div>

    <div id="pot-display">POT: $<span id="pot">0</span></div>

    <div id="cartas-mesa"></div>

    <div id="info-jugador">
    <div id="nombre-jugador">Jugador</div>
    <div id="dinero-jugador-display">$<span id="dinero-jugador">0</span></div>
    </div>

    <div id="cartas-jugador"></div>

    <div id="fichas-display"></div>

    <div id="acciones"></div>

    <script src="js/script.js"></script>
</div>

</body>
</html>
